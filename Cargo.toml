[package]
name = "annotation-tool"
version = "0.1.0"
edition = "2024"
description = "YOLO annotation tool (Rust/GPUI port of Annotation-Tool)"
license = "MIT"

[dependencies]
gpui = "=0.2.2"
image = "0.25"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
unicode-segmentation = "1"
smallvec = "1"
anyhow = "1"
smol = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
