name: Release

# Push a tag like `v2.0.0` to build Windows + macOS and publish a GitHub Release.
# Run manually (Actions tab -> Release -> Run workflow) to build without releasing;
# the packages are then attached to the run as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # rust-toolchain.toml pins a Windows host for local dev; CI uses plain stable.
  RUSTUP_TOOLCHAIN: stable

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # .cargo/config.toml hard-codes a local MSVC linker path; let rustc find it.
      - name: Drop local cargo config
        shell: pwsh
        run: Remove-Item .cargo/config.toml -ErrorAction SilentlyContinue

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "Annotation-Tool-windows-x64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item target/release/annotation-tool.exe "dist/$name/Annotation Tool.exe"
          Copy-Item -Recurse data "dist/$name/data"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      # Newer Xcode ships the Metal compiler as a separate download; GPUI needs it.
      - name: Ensure Metal toolchain
        run: xcrun -f metal || xcodebuild -downloadComponent MetalToolchain

      - uses: Swatinem/rust-cache@v2

      - name: Build (Apple Silicon + Intel)
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Package .app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || VERSION="0.0.0-dev"
          APP="dist/Annotation Tool.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/annotation-tool" \
            target/aarch64-apple-darwin/release/annotation-tool \
            target/x86_64-apple-darwin/release/annotation-tool
          cp -R data "$APP/Contents/Resources/data"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Annotation Tool</string>
            <key>CFBundleDisplayName</key><string>Annotation Tool</string>
            <key>CFBundleIdentifier</key><string>gg.eklipse.annotation-tool</string>
            <key>CFBundleExecutable</key><string>annotation-tool</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          # Ad-hoc signature (no Apple Developer ID): required to launch on Apple Silicon.
          codesign --force --deep --sign - "$APP"
          (cd dist && ditto -c -k --keepParent "Annotation Tool.app" Annotation-Tool-macos-universal.zip)

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  release:
    if: github.ref_type == 'tag'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            ## Downloads
            - **Windows:** `Annotation-Tool-windows-x64.zip`: unzip and run `Annotation Tool.exe`. If SmartScreen warns, click *More info* → *Run anyway*.
            - **macOS (Apple Silicon + Intel):** `Annotation-Tool-macos-universal.zip`: unzip and move `Annotation Tool.app` to Applications. The app is not notarized, so the first time, right-click it → *Open* → *Open* (or run `xattr -cr "/Applications/Annotation Tool.app"`). Settings and class files live in `~/Library/Application Support/Annotation Tool`.
